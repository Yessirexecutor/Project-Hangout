<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Plaza | Global Broadcast</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --admin: #ff3c00; --gold: #ffd700; --void: #020205; }
        body { margin: 0; background: var(--void); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* START MENU */
        #start-menu { position: fixed; inset: 0; background: #050510; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .panel { background: rgba(0,0,0,0.85); border: 1px solid var(--neon); padding: 20px; border-radius: 8px; }
        .menu-input { background: #111; border: 1px solid var(--neon); color: white; padding: 12px; width: 220px; border-radius: 5px; outline: none; text-align: center; margin-bottom: 10px; display: block; }
        
        /* ADMIN CONSOLE (TOP RIGHT) */
        #admin-panel {
            position: fixed; top: 20px; right: 20px; width: 220px; 
            background: rgba(10, 5, 5, 0.95); border: 1px solid var(--admin);
            padding: 15px; border-radius: 5px; z-index: 200; display: none;
            box-shadow: 0 0 20px rgba(255, 60, 0, 0.4);
        }
        .admin-title { color: var(--admin); font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
        .admin-btn { background: var(--admin); border: none; color: white; padding: 8px; cursor: pointer; font-size: 11px; font-weight: bold; width: 100%; border-radius: 3px; margin-top: 5px; }
        
        /* GLOBAL ALERT OVERLAY */
        #announcement {
            position: fixed; top: 30%; width: 100%; text-align: center; 
            font-size: 3rem; font-weight: 900; color: white;
            text-shadow: 0 0 10px var(--admin), 0 0 30px var(--admin);
            display: none; z-index: 999; pointer-events: none;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* UI HUD */
        #hud { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        #chat-container { position: absolute; bottom: 20px; left: 20px; width: 280px; z-index: 10; pointer-events: all; }
        #messages { height: 100px; overflow-y: auto; font-size: 13px; color: #aaa; margin-bottom: 8px; }
        #chat-in { background: #111; border: 1px solid var(--neon); color: white; padding: 10px; width: 100%; box-sizing: border-box; outline: none; border-radius: 4px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="start-menu">
        <div class="panel" style="text-align: center;">
            <h1 style="color:var(--neon); margin:0 0 20px;">NEON PLAZA</h1>
            <input type="text" id="name-in" class="menu-input" placeholder="DISPLAY NAME" maxlength="10">
            <input type="password" id="admin-in" class="menu-input" placeholder="ADMIN CODE">
            <button onclick="enterGame()" style="background:var(--neon); border:none; padding:12px; cursor:pointer; font-weight:bold; border-radius:5px; width:100%;">JOIN PLAZA</button>
        </div>
    </div>

    <div id="admin-panel">
        <div class="admin-title">Admin Console</div>
        <button class="admin-btn" onclick="sendGlobalAlert()">📢 GLOBAL ANNOUNCEMENT</button>
        <button class="admin-btn" style="background:#444" onclick="toggleSpeed()">🚀 SPEED HACK (ME)</button>
        <div style="font-size: 9px; opacity: 0.5; margin-top: 10px; text-align: center;">F2 TO HIDE</div>
    </div>

    <div id="announcement">ADMIN ALERT</div>

    <div id="hud">
        <div class="panel" style="padding: 10px; font-size: 12px;">
            <div id="status" style="color:var(--neon)">Syncing...</div>
            <div id="pop">Players: 1</div>
        </div>
    </div>

    <div id="chat-container" style="display:none;">
        <div id="messages"></div>
        <input type="text" id="chat-in" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendChat()">
    </div>

    <canvas id="world"></canvas>

    <script>
        const canvas = document.getElementById('world');
        const ctx = canvas.getContext('2d');
        const SECRET_CODE = "Bellaisbrown1";
        
        let client, players = {}, keys = {};
        const TOPIC = "v1/plaza/broadcast/2026";
        
        let isAdmin = false;
        let baseSpeed = 5;

        const me = {
            id: 'u' + Math.random().toString(36).substr(2, 5),
            name: "", x: 300, y: 300, 
            color: `hsl(${Math.random() * 360}, 80%, 60%)`,
            isAdm: false, msg: "", msgTime: 0
        };

        function enterGame() {
            const name = document.getElementById('name-in').value;
            const code = document.getElementById('admin-in').value;
            if(!name) return alert("Enter a name!");
            
            me.name = name.toUpperCase();
            if(code === SECRET_CODE) {
                isAdmin = true;
                me.isAdm = true;
                me.color = "#ffffff";
            }

            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('chat-container').style.display = 'block';
            initMulti();
        }

        function initMulti() {
            client = mqtt.connect('wss://test.mosquitto.org:8081');
            client.on('connect', () => {
                document.getElementById('status').innerText = "ONLINE";
                client.subscribe(TOPIC);
                setInterval(() => {
                    if(client.connected) client.publish(TOPIC, JSON.stringify({ type:'pos', ...me }));
                }, 50);
            });

            client.on('message', (topic, message) => {
                const data = JSON.parse(message.toString());
                if (data.id === me.id && data.type !== 'alert') return; // Ignore own movement, but process alerts

                if (data.type === 'alert') {
                    displayAlert(data.text);
                } else if (data.type === 'chat') {
                    addChatMessage(data.name, data.text, data.isAdm);
                } else if (data.type === 'pos') {
                    if (!players[data.id]) players[data.id] = {...data, tx: data.x, ty: data.y};
                    else { players[data.id].tx = data.x; players[data.id].ty = data.y; players[data.id].isAdm = data.isAdm; players[data.id].color = data.color;}
                }
            });
            draw();
        }

        // --- ADMIN COMMANDS ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F2' && isAdmin) {
                const p = document.getElementById('admin-panel');
                p.style.display = p.style.display === 'block' ? 'none' : 'block';
            }
            keys[e.key.toLowerCase()] = true;
        });

        function sendGlobalAlert() {
            const t = prompt("ENTER YOUR GLOBAL MESSAGE:");
            if(t) {
                client.publish(TOPIC, JSON.stringify({ 
                    type: 'alert', 
                    text: t, 
                    id: me.id 
                }));
            }
        }

        function displayAlert(t) {
            const e = document.getElementById('announcement');
            e.innerText = t;
            e.style.display = 'block';
            // Play a small sound if you want, or just flash
            setTimeout(() => { e.style.display = 'none'; }, 5000);
        }

        function toggleSpeed() {
            baseSpeed = baseSpeed === 5 ? 12 : 5;
        }

        // --- CORE CHAT & DRAW ---
        function sendChat() {
            const i = document.getElementById('chat-in');
            if(!i.value) return;
            client.publish(TOPIC, JSON.stringify({ type: 'chat', id: me.id, name: me.name, text: i.value, isAdm: isAdmin }));
            me.msg = i.value; me.msgTime = Date.now();
            addChatMessage(me.name, i.value, isAdmin);
            i.value = '';
        }

        function addChatMessage(n, t, a) {
            const m = document.getElementById('messages');
            m.innerHTML += `<div><b style="color:${a ? 'var(--admin)' : 'var(--neon)'}">${a ? '[ADMIN] ' : ''}${n}:</b> ${t}</div>`;
            m.scrollTop = m.scrollHeight;
        }

        window.onkeyup = (e) => { keys[e.key.toLowerCase()] = false; };

        function update() {
            if (keys['w']) me.y -= baseSpeed;
            if (keys['s']) me.y += baseSpeed;
            if (keys['a']) me.x -= baseSpeed;
            if (keys['d']) me.x += baseSpeed;

            Object.values(players).forEach(p => {
                p.x += (p.tx - p.x) * 0.2; p.y += (p.ty - p.y) * 0.2;
            });
            document.getElementById('pop').innerText = "Players: " + (Object.keys(players).length + 1);
        }

        function draw() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            update();
            [...Object.values(players), me].forEach(p => {
                if(p.isAdm) {
                    ctx.shadowBlur = 25; ctx.shadowColor = "red";
                    ctx.strokeStyle = "red"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.stroke();
                }
                ctx.shadowBlur = 15; ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0; ctx.fillStyle = "white"; ctx.textAlign = "center";
                ctx.font = "bold 12px sans-serif";
                ctx.fillText(p.name, p.x, p.y + 35);
                if(p.isAdm) { ctx.fillStyle = "gold"; ctx.font = "16px Arial"; ctx.fillText("👑", p.x, p.y - 20); }
                if (p.msg && Date.now() - p.msgTime < 5000) {
                    ctx.fillStyle = "white"; ctx.font = "italic 12px sans-serif";
                    ctx.fillText(p.msg, p.x, p.y - (p.isAdm ? 40 : 25));
                }
            });
            requestAnimationFrame(draw);
        }
    </script>
</body>
</html>
