<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Plaza | Smooth Multi</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --void: #050508; --panel: rgba(10, 10, 20, 0.95); }
        body { margin: 0; background: var(--void); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        /* UI HUD */
        #hud { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .panel { background: var(--panel); border: 1px solid var(--neon); padding: 15px; border-radius: 8px; pointer-events: all; box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
        
        /* Color Menu */
        .color-menu { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; max-width: 200px; }
        .color-opt { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-opt:hover { transform: scale(1.2); border-color: white; }

        /* Chat */
        #chat-area { position: absolute; bottom: 20px; left: 20px; width: 300px; z-index: 10; }
        #messages { height: 100px; overflow-y: auto; font-size: 13px; margin-bottom: 8px; color: #888; text-shadow: 0 0 2px black; }
        input { background: #000; border: 1px solid var(--neon); color: var(--neon); padding: 10px; width: 100%; outline: none; box-sizing: border-box; border-radius: 5px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="panel">
            <h2 style="margin:0; font-size: 1.2rem; color: var(--neon); letter-spacing: 2px;">NEON PLAZA</h2>
            <div style="font-size: 0.8rem; margin: 5px 0; opacity: 0.7;">POPULATION: <span id="pop-count">1</span></div>
            
            <div style="font-size: 0.7rem; margin-top: 10px; color: var(--neon);">CHANGE GLOW:</div>
            <div class="color-menu">
                <div class="color-opt" style="background: #00f2ff;" onclick="changeColor('#00f2ff')"></div>
                <div class="color-opt" style="background: #ff007b;" onclick="changeColor('#ff007b')"></div>
                <div class="color-opt" style="background: #bc13fe;" onclick="changeColor('#bc13fe')"></div>
                <div class="color-opt" style="background: #00ff9d;" onclick="changeColor('#00ff9d')"></div>
                <div class="color-opt" style="background: #ffcc00;" onclick="changeColor('#ffcc00')"></div>
                <div class="color-opt" style="background: #ffffff;" onclick="changeColor('#ffffff')"></div>
            </div>
        </div>
    </div>

    <div id="chat-area">
        <div id="messages"></div>
        <input type="text" id="chat-in" placeholder="Press Enter to talk..." onkeydown="if(event.key==='Enter') sendChat()">
    </div>

    <canvas id="world"></canvas>

    <script>
        const canvas = document.getElementById('world');
        const ctx = canvas.getContext('2d');
        
        let peer, connections = {}, players = {};
        const keys = { w: false, a: false, s: false, d: false };
        
        const me = {
            id: null,
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            vx: 0, vy: 0,
            color: '#00f2ff',
            msg: ""
        };

        function init() {
            peer = new Peer('plaza-' + Math.random().toString(36).substr(2, 6));
            peer.on('open', (id) => {
                me.id = id;
                players[id] = me;
            });
            peer.on('connection', handleConn);
        }

        function handleConn(conn) {
            conn.on('open', () => {
                connections[conn.peer] = conn;
                conn.send({ type: 'sync', player: me });
            });
            conn.on('data', (data) => {
                if (data.type === 'sync' || data.type === 'move' || data.type === 'colorUpdate') {
                    players[data.player.id] = data.player;
                    document.getElementById('pop-count').innerText = Object.keys(players).length;
                }
                if (data.type === 'chat') showChat(data.id, data.text);
            });
            conn.on('close', () => { delete players[conn.peer]; });
        }

        function changeColor(hex) {
            me.color = hex;
            broadcast({ type: 'colorUpdate', player: me });
        }

        window.onkeydown = (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; };
        window.onkeyup = (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; };

        function updatePhysics() {
            const acc = 0.6, fric = 0.9, maxSpeed = 5;
            if (keys.w) me.vy -= acc; if (keys.s) me.vy += acc;
            if (keys.a) me.vx -= acc; if (keys.d) me.vx += acc;
            me.vx *= fric; me.vy *= fric;
            me.x += me.vx; me.y += me.vy;

            // Boundary checks
            if (me.x < 0) me.x = canvas.width; if (me.x > canvas.width) me.x = 0;
            if (me.y < 0) me.y = canvas.height; if (me.y > canvas.height) me.y = 0;

            if (Math.abs(me.vx) > 0.05 || Math.abs(me.vy) > 0.05) {
                broadcast({ type: 'move', player: me });
            }
        }

        function broadcast(data) {
            Object.values(connections).forEach(c => { if(c.open) c.send(data); });
        }

        function sendChat() {
            const input = document.getElementById('chat-in');
            if(!input.value) return;
            showChat('me', input.value);
            broadcast({ type: 'chat', id: me.id, text: input.value });
            input.value = '';
        }

        function showChat(sender, text) {
            const box = document.getElementById('messages');
            const id = sender === 'me' ? "YOU" : sender.split('-')[1].toUpperCase();
            box.innerHTML += `<div><b style="color:${sender==='me'?me.color:'#fff'}">${id}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
            if(players[sender === 'me' ? me.id : sender]) {
                players[sender === 'me' ? me.id : sender].msg = text;
                setTimeout(() => { if(players[sender]) players[sender].msg = ""; }, 4000);
            }
        }

        function draw() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            updatePhysics();

            Object.values(players).forEach(p => {
                // Smooth glow effect
                ctx.shadowBlur = 25;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Message text
                if(p.msg) {
                    ctx.fillStyle = "white";
                    ctx.font = "bold 13px Segoe UI";
                    ctx.textAlign = "center";
                    ctx.fillText(p.msg, p.x, p.y - 35);
                }
                
                // Name Tag
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.font = "10px monospace";
                ctx.fillText(p.id === me.id ? "YOU" : p.id.split('-')[1].toUpperCase(), p.x, p.y + 28);
            });

            requestAnimationFrame(draw);
        }

        init();
        draw();
    </script>
</body>
</html>
